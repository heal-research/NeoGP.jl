name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
  schedule:
    # Catch breaking changes in new releases of the registered dependencies.
    - cron: '0 4 * * 1'
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
# Every job is skipped while the repository is private.
jobs:
  test:
    if: ${{ !github.event.repository.private }}
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.13' # julia compat lower bound
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.version == '1' }}
      - name: CLI end-to-end tests
        run: |
          julia --project=script -e 'using Pkg; Pkg.instantiate()'
          julia --project=script --code-coverage=@$PWD/src script/test_cli_e2e.jl
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1'
        with:
          directories: src
      - uses: codecov/codecov-action@v7
        if: matrix.version == '1'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  downgrade:
    if: ${{ !github.event.repository.private }}
    name: Lowest compatible versions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      # julia-downgrade-compat keeps only path sources in the manifest.
      - name: Check out the url sources as path sources
        run: julia .github/scripts/url_sources_to_paths.jl . "$RUNNER_TEMP/sources"
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          skip: SymRegInterpreter,SymRegLikelihoods,SymRegModelSelection,DelimitedFiles,LinearAlgebra,Random,Test
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
          allow_reresolve: false
